# conf/config.yaml
defaults:
  - _self_
  - model: qwen
  - task: blocksworld  # or countdown
  - algorithm: grpo    # or ppo

# Mode: either "train" or "inference"
mode: "train"

experiment:
  dataset_size: 0
  dataset_seed: 1234
  test_size: 0.1

output:
  root_path: ${oc.env:ROOT_PATH}
  model_name: ${task.name}_${algorithm.name}  # This will dynamically set the model name based on task and algorithm

lora:
  r: 32
  alpha: 64
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "v_proj"
  task_type: "CAUSAL_LM"

# Optional GPU memory management
occupy_gpu_memory: false
occupy_gpu_memory_gb: 50
gpu_device: "cuda:0"

hydra:
  run:
    dir: ${output.root_path}/outputs/${model.name}_${task.name}_${algorithm.name}_${now:%Y%m%d%H%M%S}
  sweep:
    dir: ${output.root_path}/multirun/${now:%Y%m%d}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false