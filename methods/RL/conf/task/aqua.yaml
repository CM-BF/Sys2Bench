name: "aqua"
data_files:
  - split_benchmarks/TEMH_splits/aqua_splits/aqua_trivial.jsonl
  - split_benchmarks/TEMH_splits/aqua_splits/aqua_easy.jsonl
  - split_benchmarks/TEMH_splits/aqua_splits/aqua_medium.jsonl
  - split_benchmarks/TEMH_splits/aqua_splits/aqua_hard.jsonl

training:
  max_prompt_length: 1600
  max_completion_length: 512

inference:
  checkpoint: 1200
  steps: 4
  temperature: 0.0
  sc_num: 1
  use_icl: false
  icl_num: 2
  num_shot: 4
  resume: 0
  max_new_tokens: 512